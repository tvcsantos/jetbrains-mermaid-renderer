name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # verifyPlugin downloads a full IDE, which dwarfs everything else in this job.
      - name: Cache Plugin Verifier IDEs
        uses: actions/cache@v6
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: plugin-verifier-${{ runner.os }}-

      # The JCEF tests stay opt-in: a headless runner has no browser to render with.
      - name: Build, test and verify
        run: ./gradlew build verifyPlugin --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/pluginVerifier

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
